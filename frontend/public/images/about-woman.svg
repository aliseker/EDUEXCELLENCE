<svg width="600" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3f4f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)"/>
  
  <!-- Woman figure -->
  <circle cx="300" cy="200" r="80" fill="#fbbf24" opacity="0.3"/>
  <rect x="250" y="280" width="100" height="200" fill="#fbbf24" opacity="0.3" rx="20"/>
  
  <!-- Laptop -->
  <rect x="200" y="350" width="200" height="120" fill="#d1d5db" rx="10"/>
  <rect x="220" y="370" width="160" height="80" fill="#1f2937"/>
  
  <!-- Glasses -->
  <circle cx="280" cy="180" r="15" fill="none" stroke="#1f2937" stroke-width="2"/>
  <circle cx="320" cy="180" r="15" fill="none" stroke="#1f2937" stroke-width="2"/>
  <line x1="295" y1="180" x2="305" y2="180" stroke="#1f2937" stroke-width="2"/>
  
  <!-- Earrings -->
  <circle cx="260" cy="220" r="8" fill="#1f2937"/>
  <circle cx="340" cy="220" r="8" fill="#1f2937"/>
  
  <!-- Red nails -->
  <rect x="190" y="420" width="20" height="8" fill="#ef4444" rx="4"/>
  <rect x="390" y="420" width="20" height="8" fill="#ef4444" rx="4"/>
  
  <!-- Text -->
  <text x="300" y="550" font-family="Arial, sans-serif" font-size="24" fill="#6b7280" text-anchor="middle">Professional Woman</text>
  <text x="300" y="580" font-family="Arial, sans-serif" font-size="18" fill="#9ca3af" text-anchor="middle">Working on Laptop</text>
</svg>

