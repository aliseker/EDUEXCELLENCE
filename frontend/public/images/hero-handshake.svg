<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grad1)"/>
  
  <!-- Table/Desk -->
  <rect x="50" y="280" width="500" height="20" fill="#8b5cf6" rx="10"/>
  <rect x="60" y="300" width="480" height="80" fill="#6b46c1" rx="5"/>
  
  <!-- Left Person -->
  <!-- Left Arm -->
  <ellipse cx="200" cy="250" rx="25" ry="40" fill="#fbbf24" transform="rotate(-30 200 250)"/>
  <!-- Left Hand -->
  <ellipse cx="180" cy="220" rx="15" ry="20" fill="#fbbf24" transform="rotate(-45 180 220)"/>
  
  <!-- Right Person -->
  <!-- Right Arm -->
  <ellipse cx="400" cy="250" rx="25" ry="40" fill="#f59e0b" transform="rotate(30 400 250)"/>
  <!-- Right Hand -->
  <ellipse cx="420" cy="220" rx="15" ry="20" fill="#f59e0b" transform="rotate(45 420 220)"/>
  
  <!-- Handshake -->
  <path d="M 190 210 Q 300 200 410 210" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 190 210 Q 300 200 410 210" stroke="#3b82f6" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Left Person Body -->
  <ellipse cx="200" cy="320" rx="40" ry="60" fill="#3b82f6"/>
  <ellipse cx="200" cy="300" rx="30" ry="40" fill="#fbbf24"/>
  
  <!-- Right Person Body -->
  <ellipse cx="400" cy="320" rx="40" ry="60" fill="#8b5cf6"/>
  <ellipse cx="400" cy="300" rx="30" ry="40" fill="#f59e0b"/>
  
  <!-- Documents on table -->
  <rect x="100" y="260" width="80" height="60" fill="#ffffff" rx="3"/>
  <rect x="110" y="270" width="60" height="4" fill="#e5e7eb"/>
  <rect x="110" y="280" width="60" height="4" fill="#e5e7eb"/>
  <rect x="110" y="290" width="40" height="4" fill="#e5e7eb"/>
  
  <rect x="420" y="260" width="80" height="60" fill="#ffffff" rx="3"/>
  <rect x="430" y="270" width="60" height="4" fill="#e5e7eb"/>
  <rect x="430" y="280" width="60" height="4" fill="#e5e7eb"/>
  <rect x="430" y="290" width="40" height="4" fill="#e5e7eb"/>
  
  <!-- EU Flag -->
  <rect x="250" y="240" width="100" height="60" fill="#ffffff" rx="5"/>
  <rect x="250" y="240" width="100" height="40" fill="#003399"/>
  <circle cx="300" cy="260" r="15" fill="#ffffff"/>
  <g fill="#ffffff">
    <polygon points="300,250 302,255 307,255 303,258 305,263 300,260 295,263 297,258 293,255 298,255" />
    <polygon points="320,250 322,255 327,255 323,258 325,263 320,260 315,263 317,258 313,255 318,255" />
    <polygon points="280,250 282,255 287,255 283,258 285,263 280,260 275,263 277,258 273,255 278,255" />
  </g>
  
  <!-- Text -->
  <text x="300" y="180" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#grad2)" text-anchor="middle">Partnership</text>
  <text x="300" y="210" font-family="Arial, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">International Cooperation</text>
  
  <!-- Decorative elements -->
  <circle cx="80" cy="100" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="520" cy="120" r="4" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="100" cy="350" r="4" fill="#06b6d4" opacity="0.6"/>
  <circle cx="500" cy="360" r="4" fill="#f59e0b" opacity="0.6"/>
</svg>

